name: Version Management

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to version bump"
        required: true
        type: choice
        options:
          - "@conductus-labs/baton-core"
          - "@conductus-labs/baton-agents"
          - "@conductus-labs/baton-cognitive-patterns"
          - "@conductus-labs/baton-knowledge"
          - "@conductus-labs/baton-workflows"
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
      create_tag:
        description: "Create git tag after version bump"
        required: false
        type: boolean
        default: false

jobs:
  version-bump:
    name: Bump Version for ${{ inputs.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Determine package path
        id: package-info
        run: |
          PACKAGE="${{ inputs.package }}"
          case "$PACKAGE" in
            "@conductus-labs/baton-core")
              PACKAGE_PATH="packages/core"
              ;;
            "@conductus-labs/baton-agents")
              PACKAGE_PATH="packages/agents"
              ;;
            "@conductus-labs/baton-cognitive-patterns")
              PACKAGE_PATH="packages/cognitive-patterns"
              ;;
            "@conductus-labs/baton-knowledge")
              PACKAGE_PATH="packages/knowledge"
              ;;
            "@conductus-labs/baton-workflows")
              PACKAGE_PATH="packages/workflows"
              ;;
            *)
              echo "❌ Unknown package: $PACKAGE"
              exit 1
              ;;
          esac

          echo "package-path=$PACKAGE_PATH" >> $GITHUB_OUTPUT
          echo "✅ Package path: $PACKAGE_PATH"

      - name: Get current version
        id: current-version
        run: |
          cd ${{ steps.package-info.outputs.package-path }}
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Bump version
        id: new-version
        run: |
          cd ${{ steps.package-info.outputs.package-path }}
          VERSION_TYPE="${{ inputs.version_type }}"
          npm version $VERSION_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Bumped version: ${{ steps.current-version.outputs.current-version }} → $NEW_VERSION"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.package-info.outputs.package-path }}/package.json
          git commit -m "chore(${{ steps.package-info.outputs.package-path }}): bump version to ${{ steps.new-version.outputs.new-version }}"
          git push

      - name: Create git tag
        if: inputs.create_tag == true
        run: |
          PACKAGE_NAME="${{ inputs.package }}"
          VERSION="${{ steps.new-version.outputs.new-version }}"
          TAG_NAME="${PACKAGE_NAME}@${VERSION}"

          git tag -a "$TAG_NAME" -m "Release $PACKAGE_NAME@$VERSION"
          git push origin "$TAG_NAME"

          echo "✅ Created and pushed tag: $TAG_NAME"
