# Workflow Template
# Format: Pure YAML (no frontmatter)
# Purpose: Define step-by-step processes executed by commands
#
# CRITICAL: All workflows MUST have associated command files in platform-specific
# directories (.cursor/commands/, .claude/commands/, .gemini/commands/).
# Workflows are ALWAYS executed via commands - they cannot be executed directly.
# Command files are out of scope for this template but are REQUIRED for workflow execution.

version: 1.0.0
workflow_name: {workflow-name}
purpose: {Brief description of workflow purpose}
associate_command: {/{command-name}} # 1-to-1 match with command file (use parameter if workflow supports multiple agents/contexts)
requires_permission_check: {true/false}  # true = permission check required, false = all agents can execute
requires_scope_validation: {true/false}  # true = scope validation required, false = no scope check needed
created: {YYYY-MM-DD} # Use ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ

# Prerequisites
prerequisites:
  - {Permission check required (if requires_permission_check: true) - validated in Step 1}
  - {Scope validation required (if requires_scope_validation: true) - validated in Step 1}
  - {Requirement 1 - e.g., "Agent must be initialized"}
  - {Requirement 2 - e.g., "Required tools must be available"}
  - {Requirement 3 - e.g., "Context file must exist"}

# Workflow Parameters (optional - only if workflow accepts parameters)
parameters:
  {parameter_name}: { Required/Optional - Description of parameter }

# Workflow Steps
workflow_steps:
  # Step 1: Validation (ONLY if requires_permission_check: true OR requires_scope_validation: true)
  # If both are false, start with your first workflow step as step 1
  
  # Option A: Permission Check (if requires_permission_check: true)
  - step: 1
    name: Validate Workflow Permission
    description: CRITICAL PREREQUISITE - Validate that the agent executing this workflow has permission
    actions:
      - Execute permission check sub-flow to validate agent has permission to execute this workflow
    sub_flows:
      - name: Validate Workflow Permission
        file: sub-flows/sub-flow-validate-workflow-permission.yml
        when: Always execute (permission check is required)
        parameters:
          workflow_name: {workflow-name}
          agent_short_name: { Extract from agent definition or context }
    decision_points:
      - condition: Permission check passes
        if_true: Continue to step 2
        if_false: Stop execution with error message
    error_handling:
      retry: false
      error_messages:
        - type: Insufficient Permission
          message_template: user-messages/workflows/{workflow-name}/step-1-insufficient-permission-error.md
          action: Stop execution

  # Option B: Scope Validation (if requires_scope_validation: true)
  # - step: 1
  #   name: Validate Agent Scope
  #   description: CRITICAL PREREQUISITE - Validate that the agent executing this workflow has the required scope
  #   actions:
  #     - Execute scope validation sub-flow to validate agent has required scope
  #   sub_flows:
  #     - name: Validate Agent Scope
  #       file: sub-flows/sub-flow-validate-scope.yml
  #       when: Always execute (scope validation is required)
  #       parameters:
  #         required_scope: {scope-name} # e.g., "project-setup", "context-management"
  #         agent_short_name: { Extract from agent definition or context }
  #   decision_points:
  #     - condition: Scope validation passes
  #       if_true: Continue to step 2
  #       if_false: Stop execution with error message
  #   error_handling:
  #     retry: false
  #     error_messages:
  #       - type: Insufficient Scope
  #         message_template: user-messages/workflows/{workflow-name}/step-1-insufficient-scope-error.md
  #         action: Stop execution

  - step: 2
    name: {Step Name}
    description: {What this step does}
    dependencies:
      - step: 1
        required: true
    actions:
      - {Action 1}
      - {Action 2}
    decision_points:
      - condition: {Condition description}
        if_true: {Action if condition is true}
        if_false: {Action if condition is false}
    sub_flows:
      - name: {Sub-flow Name}
        file: sub-flows/{sub-flow-file-name}.yml
        when: {Condition when to execute this sub-flow}
        parameters:
          {parameter_name}: { parameter value or reference }
    error_handling:
      retry: {true/false}
      warning_messages:
        - type: {Warning Type}
          message: "{Warning message}"
          action: {Continue execution/Stop execution}
      error_messages:
        - type: {Error Type}
          message_template: user-messages/workflows/{workflow-name}/{error-template-name}.md
          action: {Stop execution/Continue execution}

  - step: 3
    name: {Step Name}
    description: {What this step does}
    actions:
      - {Action 1}
    parallel_execution:
      enabled: {true/false}
      steps: [{List of steps that can run in parallel}]
    confirmation_template: |
      {Confirmation message template with {placeholders}}

# Error Handling
error_handling:
  global_retry:
    enabled: {true/false}
    max_retries: {number}
    backoff_strategy: {exponential/linear/fixed}
  
  error_types:
    - type: {Error Type - e.g., "Network Error"}
      handling: {How to handle this error}
      recovery: {Recovery action}
    
    - type: {Error Type - e.g., "Validation Error"}
      handling: {How to handle this error}
      recovery: {Recovery action}

# Command References
command_references:
  - command: {/{command-name}}
    description: {What this command does}
    when_to_use: {When to invoke this command}
    example: "{/{command-name} {example-arguments}}"
  
  - command: {/{command-name}}
    description: {What this command does}
    when_to_use: {When to invoke this command}

# Examples
examples:
  - name: {Example Name}
    description: {What this example demonstrates}
    input: {Example input or scenario}
    expected_output: {Expected result}
    workflow_path: {Steps that will be executed}

# Notes
notes:
  - Always use message_template: for user-facing error messages (not inline message:)
  - Use ISO 8601 format (YYYY-MM-DDTHH:MM:SSZ) for date/time values
  - If workflow needs scope validation, set requires_scope_validation: true and call sub-flow-validate-scope.yml in Step 1
  - If workflow needs permission validation, set requires_permission_check: true and call sub-flow-validate-workflow-permission.yml in Step 1
  - Currently, only project-initialisation requires validation (uses permission validation)
  - All other workflows can be run by any agent (no validation required)

