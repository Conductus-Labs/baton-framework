# Sub-Workflow: Load Agent Boundaries
# Format: Pure YAML (no frontmatter)
# Purpose: Load agent-specific boundaries file
#
# CRITICAL REQUIREMENT: This sub-workflow MUST be called from within another workflow.
# Sub-workflows are NOT standalone - they are modular components designed to be
# executed as part of a larger workflow process.
#
# IMPORTANT: Sub-workflows do NOT have associated command files and CANNOT be executed
# directly by users or agents. They can ONLY be called from within parent workflows.
# Only main workflows have associated commands and can be executed directly.

version: 1.0.0
workflow_name: sub-flow-load-agent-boundaries
purpose: Load agent-specific boundaries file
created: 2025-11-23

# CRITICAL: This sub-workflow MUST be called from within another workflow
# Do NOT execute this sub-workflow directly. It is a reusable component
# designed to be invoked by parent workflows.

# Prerequisites
prerequisites:
  - Parent workflow must provide agent_short_name parameter
  - Agent boundaries file must exist at `.baton/boundaries/{agent_short_name}-boundaries.md`

# Sub-Workflow Parameters
parameters:
  agent_short_name: {Required - Agent short-name for boundaries file}

# Sub-Workflow Steps
workflow_steps:
  - step: 1
    name: Validate Agent Scope
    description: CRITICAL PREREQUISITE - Validate that the agent executing the parent workflow has the required scope to call this sub-flow
    actions:
      - Get agent scope array from parent workflow context (agent executing the parent workflow)
      - Verify agent's scope array includes required scope: boundaries
    decision_points:
      - condition: Agent scope includes required scope
        if_true: Continue to step 2
        if_false: Stop execution with error message
    error_handling:
      retry: false
      error_messages:
        - type: Insufficient Scope
          message: "❌ Error: Insufficient scope to execute this sub-flow\n\nSub-flow: sub-flow-load-agent-boundaries\nRequired scope: boundaries\nAgent: {agent_name}\nAgent scopes: {agent_scopes_list}\n\nThis agent does not have the required scope to execute this sub-flow.\nThe parent workflow cannot call this sub-flow because the agent lacks the 'boundaries' scope."
          action: Stop execution

  - step: 2
    name: Read Agent Boundaries File
    description: Read the agent-specific boundaries file
    actions:
      - Read file: `.baton/boundaries/{agent_short_name}-boundaries.md`
      - Parse YAML frontmatter to extract metadata (version, boundary_type, scope, created)
      - Read markdown content sections
    error_handling:
      retry: false
      error_messages:
        - type: Boundaries File Read Error
          message: "⚠️ Warning: Cannot read agent boundaries file\n\nFile: .baton/boundaries/{agent_short_name}-boundaries.md\n\nContinuing without agent boundaries..."
          action: Continue execution (non-critical)

  - step: 3
    name: Extract Agent Boundaries Information
    description: Extract three-tier boundary system from file
    dependencies:
      - step: 2
        required: true
    actions:
      - Extract "Always Do" section (mandatory actions - overrides project boundaries)
      - Extract "Ask First" section (actions requiring approval - overrides project boundaries)
      - Extract "Never Do" section (prohibited actions - overrides project boundaries)
      - Extract Scope Definitions section
      - Extract Examples section (if present)
      - Note: Agent boundaries override project boundaries where they conflict

# Error Handling
error_handling:
  global_retry:
    enabled: false
    max_retries: 0
  
  error_types:
    - type: Boundaries File Read Error
      handling: Continue execution with warning (non-critical)
      recovery: Parent workflow continues without agent boundaries

# Notes
notes:
  - This sub-workflow is called when agent boundaries file exists
  - Agent boundaries override project boundaries where they conflict
  - Agent boundaries are optional (no warning if not found)
  - Boundaries file format: Markdown with YAML frontmatter
  - Boundaries file location: `.baton/boundaries/{agent_short_name}-boundaries.md`
  - Three-tier system: Always Do / Ask First / Never Do

