# Sub-Workflow: Create Agent Context
# Format: Pure YAML (no frontmatter)
# Purpose: Create default agent context file from template
#
# CRITICAL REQUIREMENT: This sub-workflow MUST be called from within another workflow.
# Sub-workflows are NOT standalone - they are modular components designed to be
# executed as part of a larger workflow process.
#
# IMPORTANT: Sub-workflows do NOT have associated command files and CANNOT be executed
# directly by users or agents. They can ONLY be called from within parent workflows.
# Only main workflows have associated commands and can be executed directly.

version: 1.0.0
workflow_name: sub-flow-create-agent-context
purpose: Create default agent context file from template
scope: context-management # Required scope for parent workflow to call this sub-flow
created: 2025-11-23

# CRITICAL: This sub-workflow MUST be called from within another workflow
# Do NOT execute this sub-workflow directly. It is a reusable component
# designed to be invoked by parent workflows.

# Prerequisites
prerequisites:
  - Parent workflow must provide agent_short_name parameter
  - Parent workflow must provide agent_name parameter (from agent definition)
  - Write access to `.baton/context/` directory
  - Context file does NOT exist at `.baton/context/{agent_short_name}-context.md`

# Sub-Workflow Parameters
parameters:
  agent_short_name: { Required - Agent short-name for context file }
  agent_name: { Required - Full agent name from agent definition }

# Sub-Workflow Steps
workflow_steps:
  - step: 1
    name: Validate Agent Scope
    description: CRITICAL PREREQUISITE - Validate that the agent executing the parent workflow has the required scope to call this sub-flow
    actions:
      - Get agent scope array from parent workflow context (agent executing the parent workflow)
      - Verify agent's scope array includes required scope: context-management
    decision_points:
      - condition: Agent scope includes required scope
        if_true: Continue to step 2
        if_false: Stop execution with error message
    error_handling:
      retry: false
      error_messages:
        - type: Insufficient Scope
          message: "❌ Error: Insufficient scope to execute this sub-flow\n\nSub-flow: sub-flow-create-agent-context\nRequired scope: context-management\nAgent: {agent_name}\nAgent scopes: {agent_scopes_list}\n\nThis agent does not have the required scope to execute this sub-flow.\nThe parent workflow cannot call this sub-flow because the agent lacks the 'context-management' scope."
          action: Stop execution

  - step: 2
    name: Get Current Date
    description: Get current date from system for context file creation
    actions:
      - "Execute system command: date +%Y-%m-%d (Unix/Git Bash) or equivalent Windows command"
      - "Store date as {current_date} for use in context file"
      - "Never use hardcoded dates - always get from system"
    error_handling:
      retry: false
      error_messages:
        - type: Date Command Error
          message: "❌ Error: Cannot get current date from system\n\nPlease verify system date command is available"
          action: Stop execution

  - step: 3
    name: Load Context Template
    description: Load context template file
    dependencies:
      - step: 2
        required: true
    actions:
      - "Read context template: src/core/templates/context-templates/context-template.md"
      - "Extract template structure and sections"
    error_handling:
      retry: false
      error_messages:
        - type: Template File Not Found
          message: "❌ Error: Context template file not found\n\nPlease verify template exists at: src/core/templates/context-templates/context-template.md"
          action: Stop execution

  - step: 4
    name: Create Context File
    description: Create new context file from template with agent-specific values
    dependencies:
      - step: 3
        required: true
    actions:
      - "Replace template placeholders: {agent-name} → {agent_name}, {YYYY-MM-DD} → {current_date} (from step 1)"
      - "Create file: .baton/context/{agent_short_name}-context.md"
      - Write frontmatter with:
          - version: 1.0.0
          - agent: { agent_name }
          - created: { current_date }
          - last_updated: { current_date }
      - Write default context sections from template
      - Set initial Current Status: "Agent initialized, ready for tasks"
    error_handling:
      retry: false
      error_messages:
        - type: Context File Creation Error
          message: "❌ Error: Cannot create context file\n\nFile: .baton/context/{agent_short_name}-context.md\n\nPlease verify:\n- Write permissions to .baton/context/ directory\n- Directory exists\n- Disk space available"
          action: Stop execution

# Error Handling
error_handling:
  global_retry:
    enabled: false
    max_retries: 0

  error_types:
    - type: Date Command Error
      handling: Stop execution with error message
      recovery: Verify system date command is available

    - type: Template File Not Found
      handling: Stop execution with error message
      recovery: Verify template file exists in framework

    - type: Context File Creation Error
      handling: Stop execution with error message
      recovery: Check file permissions and directory access

# Notes
notes:
  - This sub-workflow is called when context file does NOT exist
  - Context file is created from template with agent-specific values
  - Current date is always obtained from system command, never hardcoded
  - "Context file location: .baton/context/{agent_short_name}-context.md"
  - Parent workflow should flag that context file was created for confirmation message
