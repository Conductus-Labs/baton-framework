# Sub-Workflow: Load Agent Context
# Format: Pure YAML (no frontmatter)
# Purpose: Load existing agent context file
#
# CRITICAL REQUIREMENT: This sub-workflow MUST be called from within another workflow.
# Sub-workflows are NOT standalone - they are modular components designed to be
# executed as part of a larger workflow process.
#
# IMPORTANT: Sub-workflows do NOT have associated command files and CANNOT be executed
# directly by users or agents. They can ONLY be called from within parent workflows.
# Only main workflows have associated commands and can be executed directly.

version: 1.0.0
workflow_name: sub-flow-load-agent-context
purpose: Load existing agent context file
scope: context-management # Required scope for parent workflow to call this sub-flow
created: 2025-11-23

# CRITICAL: This sub-workflow MUST be called from within another workflow
# Do NOT execute this sub-workflow directly. It is a reusable component
# designed to be invoked by parent workflows.

# Prerequisites
prerequisites:
  - Parent workflow must provide agent_short_name parameter
  - Context file must exist at `.baton/context/{agent_short_name}-context.md`

# Sub-Workflow Parameters
parameters:
  agent_short_name: {Required - Agent short-name for context file}

# Sub-Workflow Steps
workflow_steps:
  - step: 1
    name: Validate Agent Scope
    description: CRITICAL PREREQUISITE - Validate that the agent executing the parent workflow has the required scope to call this sub-flow
    actions:
      - Get agent scope array from parent workflow context (agent executing the parent workflow)
      - Verify agent's scope array includes required scope: context-management
    decision_points:
      - condition: Agent scope includes required scope
        if_true: Continue to step 2
        if_false: Stop execution with error message
    error_handling:
      retry: false
      error_messages:
        - type: Insufficient Scope
          message: "❌ Error: Insufficient scope to execute this sub-flow\n\nSub-flow: sub-flow-load-agent-context\nRequired scope: context-management\nAgent: {agent_name}\nAgent scopes: {agent_scopes_list}\n\nThis agent does not have the required scope to execute this sub-flow.\nThe parent workflow cannot call this sub-flow because the agent lacks the 'context-management' scope."
          action: Stop execution

  - step: 2
    name: Read Context File
    description: Read the agent context file
    actions:
      - Read file: `.baton/context/{agent_short_name}-context.md`
      - Parse YAML frontmatter to extract metadata (version, agent, created, last_updated)
      - Read markdown content sections
    error_handling:
      retry: false
      error_messages:
        - type: Context File Read Error
          message: "❌ Error: Cannot read context file\n\nFile: .baton/context/{agent_short_name}-context.md\n\nPlease verify:\n- File exists\n- Read permissions available\n- File is valid Markdown format"
          action: Stop execution

  - step: 3
    name: Extract Context Information
    description: Extract key information from context file
    dependencies:
      - step: 2
        required: true
    actions:
      - Extract Current Status section
      - Extract Recent Work section (session summaries)
      - Extract Decisions Made section
      - Extract Learnings and Insights section
      - Extract Ongoing Projects section
      - Extract Future Priorities section
      - Extract User Preferences section (if present)
      - Extract Research Findings section (if present)
      - Extract Notes section (if present)

# Error Handling
error_handling:
  global_retry:
    enabled: false
    max_retries: 0
  
  error_types:
    - type: Context File Read Error
      handling: Stop execution with error message
      recovery: Verify file exists and has read permissions

# Notes
notes:
  - This sub-workflow is called when context file already exists
  - Context file format: Markdown with YAML frontmatter
  - Context file location: `.baton/context/{agent_short_name}-context.md`
  - All context sections are extracted for use by parent workflow

