# Sub-Workflow: Create Agent Boundaries File
# Format: Pure YAML (no frontmatter)
# Purpose: Create agent boundaries file from template
#
# CRITICAL REQUIREMENT: This sub-workflow MUST be called from within another workflow.
# Sub-workflows are NOT standalone - they are modular components designed to be
# executed as part of a larger workflow process.
#
# IMPORTANT: Sub-workflows do NOT have associated command files and CANNOT be executed
# directly by users or agents. They can ONLY be called from within parent workflows.
# Only main workflows have associated commands and can be executed directly.

version: 1.0.0
workflow_name: sub-flow-create-agent-boundaries
purpose: Create agent boundaries file from template
created: 2025-11-25

# CRITICAL: This sub-workflow MUST be called from within another workflow
# Do NOT execute this sub-workflow directly. It is a reusable component
# designed to be invoked by parent workflows.

# Prerequisites
prerequisites:
  - Parent workflow must provide agent_name and agent_short_name parameters
  - Write access to `.baton/boundaries/` directory
  - Agent boundaries template must exist at `src/core/templates/boundaries-templates/agent-boundaries-template.md`

# Sub-Workflow Parameters
parameters:
  agent_name: { Required - Full agent name from agent definition }
  agent_short_name: { Required - Agent short name for file naming }

# Sub-Workflow Steps
workflow_steps:
  - step: 1
    name: Get Current Date
    description: Get current date from system for boundaries file creation
    actions:
      - "Execute system command: date +%Y-%m-%d (Unix/Git Bash) or equivalent Windows command"
      - "Store date as {current_date} for use in boundaries file"
      - "Never use hardcoded dates - always get from system"
    error_handling:
      retry: false
      error_messages:
        - type: Date Command Error
          message: "❌ Error: Cannot get current date from system\n\nPlease verify system date command is available"
          action: Stop execution

  - step: 2
    name: Load Agent Boundaries Template
    description: Load agent boundaries template file
    dependencies:
      - step: 1
        required: true
    actions:
      - "Read template file: src/core/templates/boundaries-templates/agent-boundaries-template.md"
      - "Extract template structure and sections"
    error_handling:
      retry: false
      error_messages:
        - type: Template File Not Found
          message: "❌ Error: Agent boundaries template file not found\n\nPlease verify template exists at: src/core/templates/boundaries-templates/agent-boundaries-template.md"
          action: Stop execution

  - step: 3
    name: Load Agent Definition
    description: Load agent definition to get full agent name if needed
    dependencies:
      - step: 2
        required: true
    actions:
      - "Read agent definition file: .baton/agents/{agent_short_name}.md"
      - "Extract agent_name from frontmatter if agent_name parameter is not provided"
      - "Use provided agent_name or extracted agent_name for template replacement"
    error_handling:
      retry: false
      warning_messages:
        - type: Agent Definition Not Found
          message: "⚠️ Warning: Agent definition file not found\n\nUsing provided agent_name parameter for template replacement."
          action: Continue execution (use provided agent_name)

  - step: 4
    name: Create Agent Boundaries File
    description: Create new agent boundaries file from template with agent-specific values
    dependencies:
      - step: 3
        required: true
    actions:
      - "Replace template placeholders:"
        - "{agent-name} → {agent_short_name}"
        - "{Agent Name} → {agent_name} (from step 3)"
        - "{YYYY-MM-DD} → {current_date} (from step 1)"
      - "Create file: .baton/boundaries/{agent_short_name}-boundaries.md"
      - Write frontmatter with:
        - version: 1.0.0
        - boundary_type: agent
        - agent_name: { agent_name }
        - scope: agent
        - description: Boundaries specific to {agent_name}
        - created: { current_date }
      - Write default boundaries sections from template
      - Keep template structure with placeholder comments for future rules
    error_handling:
      retry: false
      error_messages:
        - type: Agent Boundaries File Creation Error
          message: "❌ Error: Cannot create agent boundaries file\n\nFile: .baton/boundaries/{agent_short_name}-boundaries.md\n\nPlease verify:\n- Write permissions to .baton/boundaries/ directory\n- Directory exists\n- Disk space available"
          action: Stop execution

# Error Handling
error_handling:
  global_retry:
    enabled: false
    max_retries: 0

  error_types:
    - type: Date Command Error
      handling: Stop execution with error message
      recovery: Verify system date command is available

    - type: Template File Not Found
      handling: Stop execution with error message
      recovery: Verify template file exists in framework

    - type: Agent Boundaries File Creation Error
      handling: Stop execution with error message
      recovery: Check file permissions and directory access

# Notes
notes:
  - This sub-workflow is called when agent boundaries file does NOT exist
  - Agent boundaries file is created from template with agent-specific values
  - Current date is always obtained from system command, never hardcoded
  - File location: .baton/boundaries/{agent_short_name}-boundaries.md
  - Parent workflow should flag that boundaries file was created for confirmation message

