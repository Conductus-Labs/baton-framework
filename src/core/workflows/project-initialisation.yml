# Project Initialisation Workflow
# Format: Pure YAML (no frontmatter)
# Purpose: Initialize a project with Baton Framework configuration files

version: 1.0.0
workflow_name: project-initialisation
purpose: Initialize a project with Baton Framework by creating project.config.yml, project.manifest, and project-boundaries.md
associate_command: /project-init
scope: project-setup # Required scope for agent to execute this workflow
# Note: This workflow requires scopes to call sub-flows:
# - project-config (for sub-flow-load-project-config, sub-flow-load-project-manifest)
# - boundaries (for sub-flow-load-project-boundaries)
# The agent executing this workflow must have these scopes in addition to project-setup
created: 2025-11-23

# Prerequisites
prerequisites:
  - Agent must have project-setup scope (only baton-agent has this scope)
  - Write access to `.baton/` directory
  - Template files must be available in baton-framework repository

# Workflow Steps
workflow_steps:
  - step: 1
    name: Validate Agent Scope
    description: CRITICAL PREREQUISITE - Validate that the agent executing this workflow has the required scope
    actions:
      - Load agent definition to get agent's scope array
      - Extract agent's scope array from agent definition frontmatter
      - Verify agent's scope array includes required scope: project-setup
    decision_points:
      - condition: Agent scope includes required scope
        if_true: Continue to step 2
        if_false: Stop execution with error message
    error_handling:
      retry: false
      error_messages:
        - type: Insufficient Scope
          message_template: user-messages/workflows/project-initialisation/step-1-insufficient-scope-error.md
          action: Stop execution

  - step: 2
    name: Check Project Initialization Status
    description: Check if project files exist and if they are in default/template state
    dependencies:
      - step: 1
        required: true
    actions:
      - Check if `.baton/project.config.yml` exists
      - Check if `.baton/project.manifest` exists
      - Check if `.baton/boundaries/project-boundaries.md` exists
      - If files exist, check if they are in default/template state (compare with templates)
    decision_points:
      - condition: Files exist and are NOT in default state (customized)
        if_true: Project already initialized - ask user if they want to reinitialize
        if_false: Continue to step 3
      - condition: Files exist and ARE in default state (template clones)
        if_true: Continue to step 3 (will update with scanned values)
        if_false: Files don't exist - continue to step 3 (will create new files)
    error_handling:
      retry: false
      warning_messages:
        - type: Project Already Initialized
          message_template: user-messages/workflows/project-initialisation/step-2-project-already-initialized-warning.md
          action: Wait for user confirmation via HITL checkpoint

  - step: 3
    name: Scan Project for Configuration Values
    description: Analyze project to estimate values for project.config.yml
    dependencies:
      - step: 2
        required: true
    actions:
      - Scan project directory structure to determine project type
      - Check for package.json, requirements.txt, Cargo.toml, etc. to identify technology stack
      - Check for .git directory and remote URL to determine source control provider and repository URL
      - Check for existing .baton/ directory structure to identify any existing agents/workflows
      - Check for project management files (package.json scripts, Makefile, etc.)
      - Identify GenAI platform from current context (Cursor, Claude, Gemini)
      - **CRITICAL**: When provider is identified (e.g., "cursor"), set name to match provider (e.g., "cursor")
      - Generate current date/time for initialization timestamp
      - Compile estimated values for project.config.yml
      - Categorize fields as:
          - Required fields (MUST be filled): project.name, project.type, project_management.type, project_management.location, gen_ai first entry name, gen_ai first entry model
          - Optional fields (can be left empty): project_management.url, knowledge entries, agents beyond baton-agent
          - Default values (already set): preferences section with auto_save_context true, verbose_logging false, check_for_updates true, send_feedback false
      - Identify which required values cannot be determined and need user input
      - For each required field that needs input, prepare guidance with examples
    error_handling:
      retry: false
      warning_messages:
        - type: Empty Project Detected
          message: "⚠️ Note: Project appears to be empty or new\n\nMost values will need to be provided by the user during the review checkpoint."
          action: Continue execution

  - step: 4
    name: HITL Checkpoint - Review and Complete Project Configuration
    description: Human-in-the-loop checkpoint to validate estimated values and collect missing values for project.config.yml
    dependencies:
      - step: 3
        required: true
    actions:
      - Load project.config.yml template (or existing file if in default state)
      - Apply estimated values from project scan
      - Identify required fields that still contain placeholders (e.g., {project-name}, {methodology}, {model-name})
      - Identify optional fields that contain placeholders
      - Identify fields with default values (preferences section)
      - Categorize fields:
          - Required with placeholders (MUST be filled)
          - Optional with placeholders (can be left empty or filled)
          - Default values (already set, can be changed)
      - For each required field with placeholder, provide:
          - Field name and path
          - Example values or valid options
          - Brief explanation of what the field is for
      - Display configuration with clear indicators for each category
      - Request user to review, validate, and complete all REQUIRED values
      - Wait for user decision (approve with values/reject/modify)
      - **CRITICAL VALIDATION**: Before accepting "approve", check ALL required fields
      - **CRITICAL VALIDATION**: If ANY required field contains a placeholder (e.g., "{methodology}", "{model-name}", "{location-type}"), REJECT the approval
      - **CRITICAL VALIDATION**: Display error message listing all required fields that still have placeholders
      - **CRITICAL VALIDATION**: Request user to provide values for missing required fields
      - **CRITICAL VALIDATION**: Only accept "approve" if ALL required fields are filled (no placeholders remain)
      - **CRITICAL VALIDATION**: If user says "approve" but required fields are missing, respond with error and ask for missing values (DO NOT proceed to step 5)
    hitl_checkpoint:
      type: specification_review
      required: true
      checkpoint_message_template: user-messages/workflows/project-initialisation/step-4-hitl-checkpoint.md
      timeout: null # No timeout - wait for user response
      required_approvers: ["user"]
      decision_options:
        approve: "Continue to step 5"
        reject: "Stop execution with cancellation message"
        modify: "Apply modifications and re-present for approval"
    decision_points:
      - condition: User responded with "approve"
        if_true: |
          **MANDATORY VALIDATION STEP - DO THIS FIRST:**
          1. Check ALL required fields in the current configuration
          2. Look for ANY placeholders in required fields (e.g., "{methodology}", "{model-name}", "{location-type}", "{project-name}", "{repository-url}", "{branch-name}")
          3. If ANY required field contains a placeholder → REJECT approval, show error, ask for values, re-present checkpoint
          4. If ALL required fields are filled (no placeholders) → Continue to step 5
        if_false: User rejected or requested modifications
      - condition: User approved AND all required fields are filled (no placeholders remain in required fields)
        if_true: Continue to step 5
        if_false: |
          **STOP - DO NOT PROCEED TO STEP 5**
          Required fields still contain placeholders. Reject approval, display error message, request required field values, re-present checkpoint
      - condition: User approved BUT required fields still contain placeholders
        if_true: |
          **REJECT APPROVAL - DO NOT PROCEED TO STEP 5**
          Display error message (type: Required Fields Missing), request required field values, re-present checkpoint
        if_false: User rejected or requested modifications
      - condition: User requested modifications
        if_true: Apply modifications, validate required fields (check for placeholders in required fields), re-present checkpoint
        if_false: User rejected - stop execution
    error_handling:
      retry: false
      error_messages:
        - type: User Rejected
          message_template: user-messages/workflows/project-initialisation/step-4-user-rejected-error.md
          action: Stop execution
        - type: Required Fields Missing
          message_template: user-messages/workflows/project-initialisation/step-4-required-fields-missing-error.md
          action: **DO NOT PROCEED TO STEP 5** - Request required field values, re-present checkpoint

  - step: 5
    name: Create/Update Project Configuration File
    description: Create or update project.config.yml with validated values from HITL checkpoint
    dependencies:
      - step: 4
        required: true
    actions:
      - Load project.config.yml template (or existing file if updating)
      - Apply validated values from HITL checkpoint
      - Final validation: Check that all required fields are filled (no placeholders remain in required fields)
      - Generate current date/time for initialization/update timestamp
      - "Set default values for preferences section (auto_save_context true, verbose_logging false, check_for_updates true, send_feedback false)"
      - Create or update `.baton/project.config.yml` with populated values
      - Verify file was created/updated successfully
      - Verify no required field placeholders remain in created file
    error_handling:
      retry: false
      error_messages:
        - type: File Creation Error
          message_template: user-messages/workflows/project-initialisation/step-5-file-creation-error.md
          action: Stop execution
        - type: Template Not Found
          message_template: user-messages/workflows/project-initialisation/step-5-template-not-found-error.md
          action: Stop execution
        - type: Required Fields Still Missing
          message_template: user-messages/workflows/project-initialisation/step-5-required-fields-still-missing-error.md
          action: Stop execution

  - step: 6
    name: Scan Project for Manifest Values
    description: Analyze project to estimate values for project.manifest
    dependencies:
      - step: 5
        required: true
    actions:
      - Extract project name from directory name or package.json/README
      - Analyze codebase structure to identify technology stack
      - Check for README.md or documentation to extract project description
      - Identify organization from git config or package.json
      - Analyze dependencies to determine technical requirements
      - Check for existing documentation about business objectives or requirements
      - Compile estimated values for project.manifest
      - Identify which values cannot be determined and need user input
    error_handling:
      retry: false
      warning_messages:
        - type: Empty Project Detected
          message_template: user-messages/workflows/project-initialisation/step-6-empty-project-warning.md
          action: Continue execution

  - step: 7
    name: HITL Checkpoint - Review and Complete Project Manifest
    description: Human-in-the-loop checkpoint to validate estimated values and collect missing values for project.manifest
    dependencies:
      - step: 6
        required: true
    actions:
      - Load project.manifest template (or existing file if in default state)
      - Display estimated values from project scan
      - Identify and highlight values that need user input
      - Request user to review, validate, and complete all values
      - Wait for user decision (approve with values/reject/modify)
    hitl_checkpoint:
      type: specification_review
      required: true
      checkpoint_message_template: user-messages/workflows/project-initialisation/step-7-hitl-checkpoint.md
      timeout: null # No timeout - wait for user response
      required_approvers: ["user"]
      decision_options:
        approve: "Continue to step 8"
        reject: "Stop execution (note: project.config.yml already created)"
        modify: "Apply modifications and re-present for approval"
    decision_points:
      - condition: User approved
        if_true: Continue to step 8
        if_false: User rejected or requested modifications
      - condition: User requested modifications
        if_true: Apply modifications, re-present checkpoint
        if_false: User rejected - stop execution
    error_handling:
      retry: false
      error_messages:
        - type: User Rejected
          message_template: user-messages/workflows/project-initialisation/step-7-user-rejected-error.md
          action: Stop execution

  - step: 8
    name: Create/Update Project Manifest File
    description: Create or update project.manifest.md with validated values from HITL checkpoint
    dependencies:
      - step: 7
        required: true
    actions:
      - Load project.manifest template (or existing file if updating)
      - Apply validated values from HITL checkpoint
      - Generate current date for created and last_updated fields
      - Transform template content - Comment out feature links section (lines with feature links) as these link to GitHub issues which may not exist yet
      - Transform template content - Replace commented feature links with HTML comment showing example format
      - Transform template content - Add note after architecture-decisions.md reference explaining file will be created when knowledge files are installed
      - Create or update .baton/project.manifest.md with populated values (note: file extension is .md, not just .manifest)
      - Verify file was created/updated successfully
    error_handling:
      retry: false
      error_messages:
        - type: File Creation Error
          message_template: user-messages/workflows/project-initialisation/step-8-file-creation-error.md
          action: Stop execution
        - type: Template Not Found
          message_template: user-messages/workflows/project-initialisation/step-8-template-not-found-error.md
          action: Stop execution
    notes:
      - "File is created with .md extension: .baton/project.manifest.md"
      - "Feature links section is commented out as examples (features link to GitHub issues which may not exist yet)"
      - "Architecture decisions note added (file will be created when knowledge files are installed)"

  - step: 9
    name: HITL Checkpoint - Project Boundaries Review
    description: Human-in-the-loop checkpoint before creating project-boundaries.md
    dependencies:
      - step: 8
        required: true
    actions:
      - Load project-boundaries template from baton-framework repository
      - Display template content to user for review
      - Request user approval to proceed with creating project-boundaries.md
      - Wait for user decision (approve/reject/modify)
    hitl_checkpoint:
      type: specification_review
      required: true
      checkpoint_message_template: user-messages/workflows/project-initialisation/step-9-hitl-checkpoint.md
      timeout: null # No timeout - wait for user response
      required_approvers: ["user"]
      decision_options:
        approve: "Continue to step 10"
        reject: "Skip boundaries creation, continue to step 11"
        modify: "Apply modifications and re-present for approval"
    decision_points:
      - condition: User approved
        if_true: Continue to step 10
        if_false: User rejected or requested modifications
      - condition: User requested modifications
        if_true: Apply modifications, re-present checkpoint
        if_false: User rejected - skip boundaries creation, continue to step 11
    error_handling:
      retry: false
      warning_messages:
        - type: User Rejected Boundaries
          message_template: user-messages/workflows/project-initialisation/step-9-user-rejected-boundaries-warning.md
          action: Continue execution (skip to step 11)

  - step: 10
    name: Create Project Boundaries File
    description: Create project-boundaries.md from template with user-provided or default values
    dependencies:
      - step: 9
        required: true
    actions:
      - Load project-boundaries template
      - Apply any user modifications from HITL checkpoint
      - Transform template content - Comment out all sections containing placeholder text (Category Name, Specific action description, Files directories placeholders, etc.)
      - Transform template content - Comment out placeholder examples sections (Allowed Actions and Blocked Actions examples)
      - Transform template content - Add HTML header comment explaining this is a template to be populated
      - Transform template content - Keep section headers (Always Do, Ask First, Never Do, etc.) but comment out the placeholder content within them
      - Transform template content - Keep the structure and important notes (IMPORTANT warning, Boundary Hierarchy, Precedence Rules) as active content
      - Generate current date for created field
      - Create .baton/boundaries/project-boundaries.md with transformed content
      - Verify file was created successfully
      - Ensure boundaries directory exists
    error_handling:
      retry: false
      error_messages:
        - type: File Creation Error
          message_template: user-messages/workflows/project-initialisation/step-10-file-creation-error.md
          action: Stop execution
        - type: Template Not Found
          message_template: user-messages/workflows/project-initialisation/step-10-template-not-found-error.md
          action: Stop execution

  - step: 11
    name: Present Initialization Confirmation
    description: Display initialization confirmation message to user
    dependencies:
      - step: 10
        required: false # Step 10 may be skipped if user rejected boundaries
      - step: 8
        required: true # Step 8 (manifest) is always completed if we reach step 11
    actions:
      - Generate initialization confirmation message
      - List all files created
      - Include next steps for user
      - Display formatted confirmation to user
    confirmation_template: user-messages/workflows/project-initialisation/step-11-confirmation.md

# Error Handling
error_handling:
  global_retry:
    enabled: false
    max_retries: 0

  error_types:
    - type: Insufficient Scope
      handling: Stop execution with error message
      recovery: User must use baton-agent to run this workflow

    - type: Project Already Initialized
      handling: Display warning, wait for user confirmation via HITL
      recovery: User can choose to reinitialize or cancel

    - type: File Creation Error
      handling: Stop execution with error message
      recovery: Check file permissions and directory access

    - type: Template Not Found
      handling: Stop execution with error message
      recovery: Verify template files exist in baton-framework repository

    - type: User Rejected (HITL)
      handling: Stop execution with cancellation message
      recovery: User can run workflow again when ready

# Command References
command_references:
  - command: /project-init
    description: Initialize project with Baton Framework (calls this workflow)
    when_to_use: First time setting up a project, or when reinitializing project files
    example: "/project-init"

  - command: /init-baton-agent
    description: Initialize baton-agent after project initialization
    when_to_use: After project initialization to load baton-agent
    example: "/init-baton-agent"

# Notes
notes:
  - This workflow includes three HITL checkpoints:
      - Review and complete project.config.yml values (step 4)
      - Review and complete project.manifest values (step 7)
      - Review project-boundaries.md template (step 9)
  - The workflow scans the project to estimate values for project.config.yml and project.manifest
  - Estimated values are validated with the user at HITL checkpoints
  - Users must provide values that cannot be determined from project scan
  - For empty projects, users will need to provide most values manually
  - Files may already exist in default/template state (created by baton-cli init)
  - If files exist in default state, they will be updated with scanned and validated values
  - If files exist with customized values, user will be warned before overwriting
  - HITL checkpoints allow users to review, validate, and complete all values before file creation/update
  - Users can approve, reject, or request modifications at each checkpoint
  - If user rejects boundaries creation, workflow continues without creating boundaries file
  - Only baton-agent has the project-setup scope required to execute this workflow
  - Template files are loaded from baton-framework repository
  - All created/updated files can be edited manually after creation
  - Project initialization can be re-run to update values (future workflows will handle updates)
  - Required fields for project.config.yml (MUST be filled, cannot contain placeholders):
      - project.name: Project name (e.g., "my-web-app", "api-service", "baton-framework")
      - project.type: Project type (e.g., "web-application", "api-service", "library", "framework")
      - project_management.type: Methodology (e.g., "baton-framework", "scrum", "agile", "waterfall", "kanban")
      - project_management.location: Location type (e.g., "github-issues", "azure-devops", "jira", "local", "linear")
      - gen_ai first entry name: Platform name (e.g., "cursor", "claude", "gemini")
      - gen_ai first entry model: Model name (e.g., "auto" for Cursor, "claude-sonnet-4" for Claude, "gemini-pro" for Gemini)
  - Optional fields (can be left empty or filled later):
      - project_management.url: URL to project management system (only needed if not using "local")
      - knowledge entries: Can be added later via baton install knowledge
      - agents beyond baton-agent: Can be added later
  - Default values (already set, can be modified):
      - preferences.auto_save_context: true
      - preferences.verbose_logging: false
      - preferences.check_for_updates: true
      - preferences.send_feedback: false
  - The workflow MUST validate that all required fields are filled before accepting approval
  - If user approves but required fields still have placeholders, the workflow must reject and request those values
