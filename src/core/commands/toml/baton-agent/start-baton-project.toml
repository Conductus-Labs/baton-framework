[command]
name = "start-baton-project"
description = "Initialize Baton Framework for a new or existing project (run-once command)"
created = "2025-11-25"

[metadata]
version = "1.0.0"
command_type = "onboarding"
platform = "baton-framework"
run_once_only = true
note = "This command will delete itself after execution"

[execution]
workflow_file = ".baton/workflows/agent-initialisation.yml"
execution_method = "multi-step"

[steps]
  [steps.step_1]
  name = "Welcome and Initialize Baton Agent"
  description = "Display welcome message and initialize baton-agent"
  actions = [
    "Display welcome message from: user-messages/commands/start-baton-project/step-1-welcome.md",
    "Execute agent-initialisation workflow with agent_short_name: baton-agent"
  ]
  error_handling = { retry = false }
  error_messages = [
    { type = "Agent Init Failed", message_template = "user-messages/commands/start-baton-project/error-agent-init-failed.md", action = "Stop execution" }
  ]

  [steps.step_2]
  name = "Check Project Initialization Status"
  description = "Determine if this is a new or existing project"
  dependencies = [{ step = 1, required = true }]
  actions = [
    "Check if .baton/project.config.yml exists",
    "Check if .baton/project.manifest.md exists",
    "Check if .baton/boundaries/project-boundaries.md exists",
    "Check if project directory has files"
  ]
  decision_points = [
    { condition = ".baton/ directory doesn't exist or is empty", if_true = "New project - proceed to step 3", if_false = "Check if existing project" },
    { condition = ".baton/ exists but files are missing or template state", if_true = "New project - proceed to step 3", if_false = "Existing project - proceed to step 3 with scanning" }
  ]

  [steps.step_3]
  name = "Scan Project for Information"
  description = "Analyze project to gather configuration information"
  dependencies = [{ step = 2, required = true }]
  actions = [
    "If existing project: Scan directory structure, package files, git config, README",
    "Extract project type, technology stack, source control info",
    "Display scan results using: user-messages/commands/start-baton-project/step-3-project-scan-results.md"
  ]
  error_handling = { retry = false }
  warning_messages = [
    { type = "Empty Project", message = "Project appears empty - most values will need user input", action = "Continue execution" }
  ]

  [steps.step_4]
  name = "Load or Create Project Files"
  description = "Ensure project configuration files exist"
  dependencies = [{ step = 3, required = true }]
  actions = [
    "Create project.config.yml from template if doesn't exist",
    "Create project.manifest.md from template if doesn't exist",
    "Create project-boundaries.md from template if doesn't exist",
    "Load existing files into memory for editing"
  ]

  [steps.step_5]
  name = "Configure Project Manifest"
  description = "Go through project.manifest.md properties one at a time"
  dependencies = [{ step = 4, required = true }]
  actions = [
    "For each property: Display prompt using: user-messages/commands/start-baton-project/step-5-manifest-property-prompt.md",
    "CRITICAL: STOP EXECUTION after displaying prompt",
    "CRITICAL: WAIT FOR USER INPUT - do not proceed until user responds",
    "Process user input: accept/yes = use suggested, none/skip = skip list items, otherwise = use as value",
    "If none/skip on list property: Clear remaining items in that list and move to next section",
    "For Business Objectives: After filling 3 placeholders, ask if user wants to add more. Continue until user says no/done",
    "For Success Criteria: After filling 4 placeholders, ask if user wants to add more. Continue until user says no/done",
    "ONLY AFTER receiving user input, update property in memory",
    "THEN proceed to next property"
  ]
  hitl_checkpoint = { required = true, timeout = null }
  properties = [
    "Project Name", "Description", "Organization", "Project Type", "Technology Stack",
    "Target Environment", "Business Objectives (can add more than 3)", "Technical Requirements",
    "Non-Functional Requirements", "Success Criteria (can add more than 4)"
  ]
  note = "For Business Objectives and Success Criteria: After filling placeholders, ask if user wants to add more. Continue until user says no/done."

  [steps.step_6]
  name = "Configure Project Config"
  description = "Go through remaining project.config.yml properties that are placeholders or empty"
  dependencies = [{ step = 5, required = true }]
  actions = [
    "For each property: Check if value is a placeholder pattern (e.g., {project-name}, {provider}, etc.) or empty",
    "If property already has a real value (not placeholder): SKIP IT - baton init already populated it",
    "If property is placeholder or empty: Display prompt using: user-messages/commands/start-baton-project/step-6-config-property-prompt.md",
    "CRITICAL: STOP EXECUTION after displaying prompt",
    "CRITICAL: WAIT FOR USER INPUT - do not proceed until user responds",
    "Process user input: accept/yes = use suggested value, otherwise = use as value",
    "ONLY AFTER receiving user input, update property in memory",
    "THEN proceed to next property"
  ]
  hitl_checkpoint = { required = true, timeout = null }
  properties = [
    "project.name", "project.type", "source_control.provider", "source_control.repository_url",
    "source_control.default_branch", "project_management.type", "project_management.location",
    "project_management.url", "gen_ai[0].name", "gen_ai[0].model", "gen_ai[0].provider"
  ]

  [steps.step_7]
  name = "Suggest and Install Agents"
  description = "For existing projects: suggest and install agents"
  dependencies = [{ step = 6, required = true }]
  when = "Existing project only"
  actions = [
    "Run: baton agent ls (or read from src/core/agents/)",
    "Analyze project comprehensively: Check project type (documentation suggests tech-writer), project_management.type (RHYTHM-Method suggests rhythm-expert), technology stack, and requirements",
    "DO NOT check project name - names can be anything and are not reliable indicators",
    "For documentation projects: ALWAYS suggest technical-writer-agent",
    "For projects with RHYTHM-Method methodology: ALWAYS suggest rhythm-expert-agent",
    "Read agent definitions if needed to understand agent purposes",
    "Mark which suggested agents are already installed (but still show them)",
    "Display suggestions with reasons using: user-messages/commands/start-baton-project/step-7-agent-suggestions.md",
    "Display ALL available agents (not just uninstalled ones) so user can select any agent",
    "CRITICAL: STOP EXECUTION after displaying suggestions",
    "CRITICAL: WAIT FOR USER RESPONSE - user must choose: all, select, or skip",
    "DO NOT auto-select any option",
    "If user selects 'select': Display selection using: user-messages/commands/start-baton-project/step-7-agent-selection.md",
    "Show ALL agents in selection list (mark which are installed) so user can select any agent",
    "CRITICAL: STOP EXECUTION and WAIT FOR USER INPUT for agent selection",
    "Install selected agents: baton agent add <agent-name>",
    "Display progress using: user-messages/commands/start-baton-project/step-7-agent-installation-progress.md",
    "Update project.config.yml with installed agents"
  ]
  hitl_checkpoint = { required = true, timeout = null }
  error_handling = { retry = false }
  warning_messages = [
    { type = "CLI Command Failed", message_template = "user-messages/commands/start-baton-project/error-cli-command-failed.md", action = "Fall back to reading from src/core/" }
  ]

  [steps.step_8]
  name = "Suggest and Install Workflows"
  description = "For existing projects: suggest and install workflows"
  dependencies = [{ step = 7, required = true }]
  when = "Existing project only"
  actions = [
    "Run: baton workflow ls (or read from src/core/workflows/)",
    "Analyze project to suggest relevant workflows",
    "Display suggestions using: user-messages/commands/start-baton-project/step-8-workflow-suggestions.md",
    "CRITICAL: STOP EXECUTION after displaying suggestions",
    "CRITICAL: WAIT FOR USER RESPONSE - user must choose: all, select, or skip",
    "DO NOT auto-select any option",
    "If user selects 'select': Display selection using: user-messages/commands/start-baton-project/step-8-workflow-selection.md",
    "CRITICAL: STOP EXECUTION and WAIT FOR USER INPUT for workflow selection",
    "Install selected workflows: baton workflow add <workflow-name>",
    "Display progress using: user-messages/commands/start-baton-project/step-8-workflow-installation-progress.md",
    "Update project.config.yml with installed workflows"
  ]
  hitl_checkpoint = { required = true, timeout = null }
  error_handling = { retry = false }
  warning_messages = [
    { type = "CLI Command Failed", message_template = "user-messages/commands/start-baton-project/error-cli-command-failed.md", action = "Fall back to reading from src/core/" }
  ]

  [steps.step_9]
  name = "Suggest and Install Knowledge Files"
  description = "For existing projects: suggest and install knowledge files"
  dependencies = [{ step = 8, required = true }]
  when = "Existing project only"
  actions = [
    "Run: baton knowledge ls (or read from src/core/knowledge/)",
    "Analyze project to suggest relevant knowledge files",
    "Display suggestions using: user-messages/commands/start-baton-project/step-9-knowledge-suggestions.md",
    "CRITICAL: STOP EXECUTION after displaying suggestions",
    "CRITICAL: WAIT FOR USER RESPONSE - user must choose: all, select, or skip",
    "DO NOT auto-select any option",
    "If user selects 'select': Display selection using: user-messages/commands/start-baton-project/step-9-knowledge-selection.md",
    "CRITICAL: STOP EXECUTION and WAIT FOR USER INPUT for knowledge selection",
    "Install selected knowledge: baton knowledge add <knowledge-name>",
    "Display progress using: user-messages/commands/start-baton-project/step-9-knowledge-installation-progress.md",
    "Update project.config.yml with installed knowledge files"
  ]
  hitl_checkpoint = { required = true, timeout = null }
  error_handling = { retry = false }
  warning_messages = [
    { type = "CLI Command Failed", message_template = "user-messages/commands/start-baton-project/error-cli-command-failed.md", action = "Fall back to reading from src/core/" }
  ]

  [steps.step_10]
  name = "Write Updated Configuration Files"
  description = "Write updated project.config.yml and project.manifest.md to disk"
  dependencies = [{ step = 9, required = true }]
  actions = [
    "Write updated project.config.yml to .baton/project.config.yml",
    "Write updated project.manifest.md to .baton/project.manifest.md",
    "Ensure proper YAML and Markdown formatting"
  ]
  error_handling = { retry = false }
  error_messages = [
    { type = "File Write Failed", message_template = "user-messages/commands/start-baton-project/error-file-write-failed.md", action = "Stop execution" }
  ]

  [steps.step_11]
  name = "Welcome Message"
  description = "Display welcome message to user"
  dependencies = [{ step = 10, required = true }]
  actions = [
    "Display welcome message using: user-messages/commands/start-baton-project/step-11-welcome-complete.md",
    "Replace placeholders: {agents_installed}, {workflows_installed}, {knowledge_installed}"
  ]

  [steps.step_12]
  name = "Delete This Command"
  description = "Delete command file to prevent re-execution"
  dependencies = [{ step = 11, required = true }]
  actions = [
    "Check if in baton-framework repo: Delete src/core/commands/markdown/baton-agent/start-baton-project.md and src/core/commands/toml/baton-agent/start-baton-project.toml",
    "Check if in project repo: Delete .cursor/commands/baton/start-baton-project.md, .claude/commands/baton/start-baton-project.md, .gemini/commands/baton/start-baton-project.toml",
    "Check each file exists before deletion, ignore errors for missing files",
    "Display confirmation using: user-messages/commands/start-baton-project/step-12-command-deleted.md with list of deleted files"
  ]
  error_handling = { retry = false }
  warning_messages = [
    { type = "Deletion Failed", message = "Warning: Could not delete command file. Please delete manually to prevent re-execution.", action = "Continue" }
  ]

[notes]
- This is a run-once-only command - it will delete itself after execution
- This command does NOT need to be in the permissions matrix
- Always use system date commands, never hardcode dates
- For new/empty projects, most values will need user input
- For existing projects, scan as much as possible to reduce user input
- CLI commands should be executed if CLI is available, otherwise read from src/core/
- All installed agents, workflows, and knowledge must be added to project.config.yml

[critical_hitl_rules]
- STOP EXECUTION immediately after displaying any prompt that requires user input
- WAIT FOR USER RESPONSE - Do NOT proceed to the next step until the user provides input
- DO NOT auto-accept suggested values - wait for explicit user confirmation
- DO NOT continue automatically - each prompt is a checkpoint that requires user interaction
- ONLY AFTER receiving user input, update the configuration and proceed to the next step
- Process user input: accept/yes = use suggested, none/skip = skip list items, otherwise = use as value
- List properties (can use none/skip): Business Objectives, Success Criteria, Technical Requirements sub-items, Non-Functional Requirements sub-items
- This applies to: Every property in Step 5, Every property in Step 6, Agent selection in Step 7, Workflow selection in Step 8, Knowledge file selection in Step 9

