# Platform-Specific Commands
# Maps commands to workflows and platforms
platform_commands:
  cursor:
    - command: "/project-init"
      workflow: "project-initialisation"
      source: "src/core/commands/markdown/baton-agent/project-init.md"
      destination: ".cursor/commands/baton/project-init.md"

    - command: "/start-baton-project"
      workflow: null
      source: "src/core/commands/markdown/baton-agent/start-baton-project.md"
      destination: ".cursor/commands/baton/start-baton-project.md"
      description: "Run-once command to initialize Baton Framework (deletes itself after execution)"

    - command: "/init-agent"
      workflow: "agent-initialisation"
      source: "src/core/commands/markdown/baton-agent/init-agent.md"
      destination: ".cursor/commands/baton/init-agent.md"

    - command: "/sync-context"
      workflow: "context-synchronisation"
      source: "src/core/commands/markdown/baton-agent/sync-context.md"
      destination: ".cursor/commands/baton/sync-context.md"

    - command: "/manage-project-rules"
      workflow: "manage-boundary-rule"
      source: "src/core/commands/markdown/baton-agent/manage-project-rules.md"
      destination: ".cursor/commands/baton/manage-project-rules.md"

    - command: "/manage-agent-rules"
      workflow: "manage-boundary-rule"
      source: "src/core/commands/markdown/baton-agent/manage-agent-rules.md"
      destination: ".cursor/commands/baton/manage-agent-rules.md"

  claude:
    - command: "/project-init"
      workflow: "project-initialisation"
      source: "src/core/commands/markdown/baton-agent/project-init.md"
      destination: ".claude/commands/baton/project-init.md"

    - command: "/start-baton-project"
      workflow: null
      source: "src/core/commands/markdown/baton-agent/start-baton-project.md"
      destination: ".claude/commands/baton/start-baton-project.md"
      description: "Run-once command to initialize Baton Framework (deletes itself after execution)"

    - command: "/init-agent"
      workflow: "agent-initialisation"
      source: "src/core/commands/markdown/baton-agent/init-agent.md"
      destination: ".claude/commands/baton/init-agent.md"

    - command: "/sync-context"
      workflow: "context-synchronisation"
      source: "src/core/commands/markdown/baton-agent/sync-context.md"
      destination: ".claude/commands/baton/sync-context.md"

    - command: "/manage-project-rules"
      workflow: "manage-boundary-rule"
      source: "src/core/commands/markdown/baton-agent/manage-project-rules.md"
      destination: ".claude/commands/baton/manage-project-rules.md"

    - command: "/manage-agent-rules"
      workflow: "manage-boundary-rule"
      source: "src/core/commands/markdown/baton-agent/manage-agent-rules.md"
      destination: ".claude/commands/baton/manage-agent-rules.md"

  gemini:
    - command: "/project-init"
      workflow: "project-initialisation"
      source: "src/core/commands/toml/baton-agent/project-init.toml"
      destination: ".gemini/commands/baton/project-init.toml"

    - command: "/start-baton-project"
      workflow: null
      source: "src/core/commands/toml/baton-agent/start-baton-project.toml"
      destination: ".gemini/commands/baton/start-baton-project.toml"
      description: "Run-once command to initialize Baton Framework (deletes itself after execution)"

    - command: "/init-agent"
      workflow: "agent-initialisation"
      source: "src/core/commands/markdown/baton-agent/init-agent.md"
      destination: ".gemini/commands/baton/init-agent.md"

    - command: "/init-baton-agent"
      workflow: "agent-initialisation"
      source: "src/core/commands/toml/baton-agent/init-baton-agent.toml"
      destination: ".gemini/commands/baton/init-baton-agent.toml"

    - command: "/sync-context"
      workflow: "context-synchronisation"
      source: "src/core/commands/toml/baton-agent/sync-context.toml"
      destination: ".gemini/commands/baton/sync-context.toml"

# Installation Rules
installation:
  # Core components that must always be installed
  mandatory:
    agents:
      - "baton-agent"
    workflows:
      - "project-initialisation"
      - "agent-initialisation"
      - "context-synchronisation"
      - "manage-boundary-rule"
    sub_flows:
      - "sub-flow-validate-workflow-permission"
      - "sub-flow-load-project-config"
      - "sub-flow-load-project-manifest"
      - "sub-flow-load-project-boundaries"
      - "sub-flow-load-agent-context"
      - "sub-flow-create-agent-context"
      - "sub-flow-load-agent-boundaries"
      - "sub-flow-create-agent-boundaries"

  # Auto-install dependencies when installing a component
  auto_install_dependencies: true

  # Require user confirmation before auto-installing dependencies
  confirm_dependencies: true

  # Installation behavior
  behavior:
    install_workflow: "install_all_sub_flows"
    remove_workflow: "check_sub_flow_dependencies"
    install_agent: "no_auto_dependencies"
    remove_agent: "check_reverse_dependencies"
    orphan_prevention: true

# Dependency Rules
dependency_rules:
  # When installing a workflow, install all its sub-flows
  workflow_install: "install_all_sub_flows"

  # When removing a workflow, only remove sub-flows if no other workflows depend on them
  workflow_remove: "check_sub_flow_dependencies"

  # When installing an agent, check if it has workflow/knowledge dependencies
  agent_install: "check_dependencies"

  # When removing an agent, check if any workflows depend on it
  agent_remove: "check_reverse_dependencies"

  # Prevent orphaned components
  orphan_prevention: true

# Notes
notes:
  - This manifest is the single source of truth for all framework components
  - All agents are available on all platforms (cursor, claude, gemini)
  - Sub-flows cannot be executed directly - they are only called from workflows
  - Knowledge files are installed by users via CLI, not part of core framework
  - Message templates are dependencies of workflows and commands - installed automatically with their dependent components
  - Core components (core: true) cannot be removed
  - Dependencies are automatically installed with user confirmation
  - When removing a component, reverse dependencies are checked to prevent orphaned components
  - Messages are linked to workflows via dependent_workflows or to commands via dependent_commands
