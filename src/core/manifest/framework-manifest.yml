# Unified Framework Manifest
# Format: Pure YAML (no frontmatter)
# Purpose: Complete inventory of all framework components (agents, workflows, knowledge, dependencies)
# Location: src/core/manifest/framework-manifest.yml
# Installed to: .baton/framework-manifest.yml
#
# This manifest provides a single source of truth for:
# - All available agents, workflows, and knowledge files
# - Component dependencies (agent→workflow/knowledge, workflow→workflow/knowledge, sub-flows)
# - Platform-specific command mappings
# - Installation rules and core status
# - Version tracking and migration support

