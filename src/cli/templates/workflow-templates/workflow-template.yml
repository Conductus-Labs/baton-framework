# Workflow Template
# Format: Pure YAML (no frontmatter)
# Purpose: Define step-by-step processes executed by commands
#
# IMPORTANT: Workflows must have corresponding command files in platform-specific
# directories (.cursor/commands/, .claude/commands/, .gemini/commands/).
# Command files are out of scope for this template but are required for workflow execution.

version: 1.0.0
workflow_name: {workflow-name}
purpose: {Brief description of workflow purpose}
created: {YYYY-MM-DD}

# Prerequisites
prerequisites:
  - {Requirement 1 - e.g., "Agent must be initialized"}
  - {Requirement 2 - e.g., "Required tools must be available"}
  - {Requirement 3 - e.g., "Context file must exist"}

# Workflow Steps
workflow_steps:
  - step: 1
    name: {Step Name}
    description: {What this step does}
    actions:
      - {Action 1}
      - {Action 2}
    decision_points:
      - condition: {Condition description}
        if_true: {Action if condition is true}
        if_false: {Action if condition is false}
    error_handling:
      retry: {true/false}
      max_retries: {number}
      fallback: {Fallback action if step fails}

  - step: 2
    name: {Step Name}
    description: {What this step does}
    actions:
      - {Action 1}
      - {Action 2}
    dependencies:
      - step: 1
        required: true
    decision_points:
      - condition: {Condition description}
        if_true: {Action if condition is true}
        if_false: {Action if condition is false}

  - step: 3
    name: {Step Name}
    description: {What this step does}
    actions:
      - {Action 1}
    parallel_execution:
      enabled: {true/false}
      steps: [{List of steps that can run in parallel}]

# Error Handling
error_handling:
  global_retry:
    enabled: {true/false}
    max_retries: {number}
    backoff_strategy: {exponential/linear/fixed}
  
  error_types:
    - type: {Error Type - e.g., "Network Error"}
      handling: {How to handle this error}
      recovery: {Recovery action}
    
    - type: {Error Type - e.g., "Validation Error"}
      handling: {How to handle this error}
      recovery: {Recovery action}

# Command References
command_references:
  - command: {/{command-name}}
    description: {What this command does}
    when_to_use: {When to invoke this command}
    example: "{/{command-name} {example-arguments}}"
  
  - command: {/{command-name}}
    description: {What this command does}
    when_to_use: {When to invoke this command}

# Examples
examples:
  - name: {Example Name}
    description: {What this example demonstrates}
    input: {Example input or scenario}
    expected_output: {Expected result}
    workflow_path: {Steps that will be executed}

# Notes
notes:
  - {Important note 1}
  - {Important note 2}
  - {Important note 3}

